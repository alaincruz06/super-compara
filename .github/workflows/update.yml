name: Update prices and deploy

on:
  schedule:
    - cron: '17 5 * * *'   # every day ~06:17 Madrid time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scraper/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch last good data
        continue-on-error: true
        run: |
          git fetch --depth 1 origin data && git worktree add prev origin/data || echo "no data branch yet"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape stores
        env:
          PREV_DIR: ${{ github.workspace }}/prev
          POSTAL_CODE: ${{ vars.POSTAL_CODE || '30002' }}
          DIA_SOURCE: ${{ secrets.DIA_SOURCE }}
        run: node scraper/build.mjs

      - name: Save data branch (latest snapshot only)
        run: |
          rm -rf /tmp/data && mkdir /tmp/data && cp site/data/*.json /tmp/data/
          cd /tmp/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Data $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
