name: Update prices and deploy

on:
  schedule:
    - cron: '17 5 * * *'   # every day ~06:17 Madrid time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scraper/**', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch last good data
        continue-on-error: true
        run: |
          git fetch --depth 1 origin gh-pages && git worktree add prev FETCH_HEAD || echo "no data branch yet"

      - name: Fetch synced Dia data
        continue-on-error: true
        run: |
          git fetch --depth 1 origin dia-data && git worktree add dia FETCH_HEAD || echo "no Dia data yet"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape stores
        env:
          PREV_DIR: ${{ github.workspace }}/prev/data
          POSTAL_CODE: ${{ vars.POSTAL_CODE || '30002' }}
          DIA_SOURCE: ${{ secrets.DIA_SOURCE || format('{0}/dia/dia.json', github.workspace) }}
        run: node scraper/build.mjs

      - name: Publish to gh-pages (latest snapshot only, no history)
        run: |
          rm -rf /tmp/pub && cp -r site /tmp/pub && cd /tmp/pub
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Deploy $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
