name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="SuperCompara/1.0 (+https://github.com/alaincruz06/super-compara)"
          C=https://tienda.consum.es/api/rest/V1.0
          echo "=== consum no-q"; curl -s -A "$UA" "$C/catalog/product?limit=2&offset=0" | python3 -c "import json,sys;d=json.load(sys.stdin);print('total',d.get('totalCount'),'hasMore',d.get('hasMore'));print(json.dumps(d['products'][0],ensure_ascii=False)[:3000])"
          echo "=== consum offer sample"; curl -s -A "$UA" "$C/catalog/product?q=leche&limit=50&offset=0" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for p in d['products']:
            pd=p.get('priceData',{})
            if len(pd.get('prices',[]))>1: print(json.dumps(pd,ensure_ascii=False)[:1200]); break"
          echo "=== consum menu top"; curl -s -A "$UA" "$C/shopping/category/menu" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for c in d: print(c['id'],c['name'],len(c.get('subcategories',c.get('children',[])) or []), list(c.keys())[:25])"
          for u in "$C/shopping/postalcode/30002" "$C/shopping/postalCode/30002" "$C/delivery/postalcode/30002" "$C/shopping/store/postalCode/30002" "$C/settings" "$C/shopping/shippingZone?postalCode=30002"; do echo "=== $u"; curl -s -A "$UA" -w "  HTTP %{http_code}" "$u" | head -c 400; echo; done
          echo "=== consum page JS endpoints"; curl -s -A "$UA" https://tienda.consum.es/es | grep -o 'src="[^"]*main[^"]*\.js"' | head -3
          for s in $(curl -s -A "$UA" https://tienda.consum.es/es | grep -o 'src="[^"]*\.js"' | sed 's/src="//;s/"$//' | head -12); do case $s in http*) u=$s;; /*) u="https://tienda.consum.es$s";; *) u="https://tienda.consum.es/es/$s";; esac; curl -s -A "$UA" "$u" | grep -o -i '[a-z/]*postal[a-zA-Z/{}]*' ; done | sort -u | head -40
      - run: |
          UA="SuperCompara/1.0 (+https://github.com/alaincruz06/super-compara)"
          for p in $(seq -w 1 52); do
            wh=$(curl -s -D - -o /dev/null -X PUT -A "$UA" -H "content-type: application/json" --data "{\"new_postal_code\":\"${p}001\"}" https://tienda.mercadona.es/api/postal-codes/actions/change-pc/ | grep -i x-customer-wh | tr -d '\r' | awk '{print $2}')
            echo "$p $wh"; sleep 0.5
          done | tee /tmp/wh.txt; echo; awk '{print $2}' /tmp/wh.txt | sort | uniq -c
