name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="SuperCompara/1.0 (+https://github.com/alaincruz06/super-compara)"
          for u in \
            https://www.carrefour.es/robots.txt \
            "https://www.carrefour.es/supermercado/" \
            "https://www.carrefour.es/search-api/query/v1/search?query=leche&scope=desktop&lang=es&rows=5&start=0&origin=default&f.op=OR" \
            https://www.compraonline.alcampo.es/robots.txt \
            "https://www.compraonline.alcampo.es/api/v5/products/search?term=leche&limit=5" \
            https://tienda.consum.es/robots.txt \
            "https://tienda.consum.es/api/rest/V1.0/catalog/product?q=leche&limit=5&offset=0" \
            "https://tienda.consum.es/api/rest/V1.0/shopping/category/menu" \
            https://supermercado.eroski.es/robots.txt \
            "https://supermercado.eroski.es/es/search/results/?q=leche" \
            https://www.lidl.es/robots.txt ; do
            echo "=== $u"
            curl -s -L -m 25 -A "$UA" -H "accept: application/json, text/html" -o /tmp/b -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$u"
            case "$u" in *robots.txt) grep -i -E "^(user-agent|disallow).*" /tmp/b | head -25 ;; *) head -c 500 /tmp/b | tr '\n' ' '; echo ;; esac
          done
