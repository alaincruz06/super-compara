name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="SuperCompara/1.0 (+https://github.com/alaincruz06/super-compara)"
          echo "=== mercadona robots"; curl -s -A "$UA" https://tienda.mercadona.es/robots.txt | head -30
          echo "=== dia robots"; curl -s -A "$UA" -w "\nHTTP %{http_code}\n" https://www.dia.es/robots.txt | grep -i -E "user-agent|disallow|HTTP" | head -30
          curl -s -A "$UA" https://prices.openfoodfacts.org/api/openapi.json -o /tmp/o.json
          python3 - <<'PY'
          import json
          o=json.load(open('/tmp/o.json'))
          for p in ['/api/v1/locations','/api/v1/prices']:
              print(p, [x['name'] for x in o['paths'][p]['get'].get('parameters',[])])
          PY
          echo "=== murcia locations"
          curl -s -A "$UA" "https://prices.openfoodfacts.org/api/v1/locations?osm_address_city__like=Murcia&size=100" | python3 -c "
          import json,sys; d=json.load(sys.stdin); print('total',d.get('total'))
          for l in d.get('items',[])[:100]: print(l.get('id'),l.get('osm_name'),'|',l.get('osm_address_city'),'|',l.get('osm_address_postcode'),'| prices',l.get('price_count'))"
          echo "=== spain locations count"; curl -s -A "$UA" "https://prices.openfoodfacts.org/api/v1/locations?osm_address_country__like=Espa&size=1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('total'))"
