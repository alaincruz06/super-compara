name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://cdn-consum.aktiosdigitalservices.com/tol/consum/media/product/img
          for u in "$B/300x300/1669_001.jpg?t=20250114091501" "$B/300x300/1669_001.jpg" "$B/1669_001.jpg" "$B/600x600/1669_001.jpg" "$B/300x300/1669.jpg" ; do
            curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}  $u\n" "$u"; done
          echo "--- sample of 30 products: imageURL vs media[0]"
          curl -s -A "SuperCompara/1.0" "https://tienda.consum.es/api/rest/V1.0/catalog/product?q=leche&limit=30&offset=0" | python3 -c "
          import json,sys,urllib.request
          d=json.load(sys.stdin)['products']
          ok_i=ok_m=0
          for p in d:
            iu=p['productData']['imageURL']; mu=(p.get('media') or [{}])[0].get('url')
            def st(u):
              try: return urllib.request.urlopen(urllib.request.Request(u,method='HEAD'),timeout=10).status
              except Exception as e: return getattr(e,'code','err')
            a=st(iu); b=st(mu) if mu else None
            ok_i+= a==200; ok_m+= b==200
          print('imageURL ok',ok_i,'/',len(d),'| media[0] ok',ok_m,'/',len(d))"
