name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="SuperCompara/1.0 (+https://github.com/alaincruz06/super-compara)"
          curl -s -A "$UA" https://prices.openfoodfacts.org/robots.txt | head -10
          for q in "locations?osm_address_city=Murcia&size=100" "locations?osm_address_country=Espa%C3%B1a&size=1" "prices?location__osm_address_city=Murcia&size=1" "prices?location__osm_address_country=Espa%C3%B1a&size=1"; do
            echo "=== $q"; curl -s -A "$UA" "https://prices.openfoodfacts.org/api/v1/$q" -o /tmp/r.json -w "HTTP %{http_code}\n"
            python3 -c "
          import json; d=json.load(open('/tmp/r.json')); print('total', d.get('total'))
          for l in d.get('items',[])[:60]:
            if 'osm_name' in l: print(' ', l.get('osm_name'),'|',l.get('osm_address_postcode'),'| prices',l.get('price_count'))" || head -c 400 /tmp/r.json
          done
